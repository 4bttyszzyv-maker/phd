function viewPreflight(){
  return `<div class="card">
    <div class="pass-head"><span class="label">Before you start</span>
      <h2 style="margin-top:6px">Before uploading anything</h2>
      <p class="lede">This approach assumes you upload substantial portions of an unexamined thesis to an LLM. That raises four separate questions, and answering one of them does not answer the others.</p></div>

    ${pfCleared()
      ? `<div class="note" style="border-left-color:var(--clear);background:var(--clear-soft);color:#1F4A38"><strong>All four settled.</strong> The prompts are unlocked. Revisit this page if your material or your institution's position changes.</div>`
      : `<div class="note stop"><strong>Prompt copying is held until these are settled.</strong> These constraints determine whether any of the method is available to you at all, so they come before the passes rather than after them.</div>`}

    ${PREFLIGHT.map(p=>{
      const v=S.preflight[p.k];
      const cls = !v.state ? "none" : v.state.startsWith("Unresolved") ? "bad" : v.state==="Not applicable" ? "na" : "ok";
      return `<div class="pf ${cls}" style="margin-top:16px">
        <div class="pf-h"><span class="pfn">${p.n}</span><h4>${esc(p.q)}</h4></div>
        <div class="pf-b">
          <p>${esc(p.body)}</p>
          <div class="grid2">
            <div class="field" style="margin-bottom:0"><span class="label">Where this stands</span>
              <select data-pfs="${p.k}">${PF_STATES.map(o=>`<option value="${esc(o)}" ${o===v.state?"selected":""}>${o||"Not yet considered"}</option>`).join("")}</select></div>
            <div class="field" style="margin-bottom:0"><span class="label">${esc(p.ask)}</span>
              <textarea data-pfn="${p.k}" style="min-height:64px" placeholder="${esc(p.ph)}">${esc(v.note)}</textarea></div>
          </div>
        </div></div>`;
    }).join("")}

    <div class="row-end"><button class="btn btn-primary" data-go="how">Next: how this works</button></div>
  </div>`;
}

function viewHow(){
  return `<div class="card">
    <div class="pass-head"><span class="label">Orientation</span>
      <h2 style="margin-top:6px">The most useful question is not “What do you think of my chapter?”</h2>
      <p class="lede">A broad request may produce fluent and apparently insightful feedback, but the judgement is difficult to audit, and the model is easily drawn into the framing supplied by the user. Asking whether a chapter is coherent can encourage it to construct a coherent reading.</p></div>

    <div class="rationale"><span class="label">The distinction this tool rests on</span>
      <p>A reader gives an impression. An auditor produces evidence that can be checked.</p>
      <p>A close reading of a multi-chapter thesis becomes harder the longer the author has lived inside the manuscript. The author reads every ambiguous passage in the light of knowing how the argument is supposed to work. An LLM does not possess that internal reconstruction either — used carefully, that is precisely its value.</p></div>

    <div class="sec"><h3>The division of labour</h3>
      <p class="hint">Each pass is built around this split, and the prompts are written to hold the model to the left-hand column.</p>
      <div class="grid2">
        <div><span class="label" style="color:var(--accent)">The model does</span>
          <ul style="margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;line-height:1.75">
            <li>extraction</li><li>comparison</li><li>bookkeeping</li><li>searching</li><li>pattern detection</li>
            <li>constructing counterarguments</li><li>tracing dependencies</li><li>identifying possible omissions</li>
            <li>repeating a procedure consistently across large amounts of text</li></ul></div>
        <div><span class="label" style="color:var(--flag)">You do</span>
          <ul style="margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;line-height:1.75">
            <li>deciding whether an apparent inconsistency matters</li><li>judging the quality of evidence</li>
            <li>determining whether conceptual development is legitimate</li><li>deciding which criticism is disciplinarily important</li>
            <li>interpreting ambiguity</li><li>assessing theoretical significance</li>
            <li>deciding what the thesis ultimately claims</li><li>revising the argument</li></ul></div>
      </div>
      <div class="rationale correction" style="margin-top:18px">
        <span class="label">The qualification that cuts across the whole of the first column</span>
        <p>Everything in the model's column produces candidates, not complete sets. It finds definitions but not necessarily every definition; it locates discharges but not necessarily every failure to discharge; it identifies drift where drift is textually obvious and misses it where it is subtle. What the model returns can be checked against the manuscript. What it fails to return leaves no trace.</p>
        <p>This method is well suited to finding problems and poorly suited to ruling them out. A student who runs all seven passes and finds little has not established that the thesis is sound. They have established that these particular procedures, on this occasion, did not surface anything — which is a much weaker statement, and should be recorded as such.</p>
      </div>
    </div>

    <div class="sec"><h3>What a usable output looks like</h3>
      <p class="hint">The most useful outputs are not answers. They are candidate problems accompanied by evidence.</p>
      <div class="grid2">
        <div style="border:1px solid var(--rule);border-left:2px solid var(--flag);border-radius:0 3px 3px 0;padding:14px 16px;background:var(--surface-2)">
          <span class="label" style="color:var(--flag)">Not this</span>
          <p style="margin:6px 0 0;font-family:var(--display);font-size:15px;color:var(--ink-2)">Chapter 4 is theoretically inconsistent with Chapter 2.</p></div>
        <div style="border:1px solid var(--rule);border-left:2px solid var(--clear);border-radius:0 3px 3px 0;padding:14px 16px;background:var(--surface-2)">
          <span class="label" style="color:var(--clear)">This</span>
          <p style="margin:6px 0 0;font-family:var(--display);font-size:15px;color:var(--ink-2)">Chapter 2 defines X using attributes A, B and C (Section 2.3, p. 41). In Chapter 4, X is operationalised using A and D (Section 4.2, p. 88), with no explicit explanation of the change from C to D. These passages appear to be the relevant evidence. Consider whether the operationalisation requires justification.</p></div>
      </div>
      <p class="hint" style="margin-top:12px">The second is more useful because you can inspect it, disagree with it and act on it. Note the locations: without them the criticism cannot be evaluated.</p>
    </div>

    <div class="sec"><h3>How to work through it</h3>
      <ol style="margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;line-height:1.8">
        <li>Settle the four pre-upload questions. The prompts stay locked until you do.</li>
        <li>Fill in the pass fields, copy the prompt, and log the run as you go.</li>
        <li>Record what comes back — in the ledger where there is one, and as findings where something looks worth pursuing.</li>
        <li>No finding becomes a revision decision until you have answered the four diagnostic questions yourself.</li>
        <li>State what the method missed before you export. That statement is part of the result, not a disclaimer on it.</li>
      </ol>
      <div class="note" style="margin-top:16px"><strong>This is not a substitute for supervision, and not a proxy for examination.</strong> It is a way of making your thesis more inspectable to you before other people read it.</div>
    </div>
    <div class="row-end"><button class="btn btn-primary" data-go="p1">Start with Pass 1</button></div>
  </div>`;
}

function spotcheckHTML(){
  const rows=S.spotchecks;
  const answered=rows.filter(r=>r.caught);
  const missed=rows.filter(r=>r.caught==="Missed by the ledger").length;
  return `<div class="sec">
    <h3>Recall spot-check</h3>
    <p class="hint">Take three or four promissory statements you already know exist, buried in the middle chapters, and check whether the ledger caught them. If it missed one, that is information about how much weight the rest of the ledger can bear.</p>
    ${rows.length?`<div class="tbl-scroll"><table class="ledger" style="min-width:600px">
      <thead><tr><th style="width:46%">Promissory statement you know exists</th><th style="width:20%">Where</th><th style="width:30%">Did the ledger catch it?</th><th></th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr>
        <td><textarea data-sc="${i}|text" rows="2" placeholder="Quote it">${esc(r.text||"")}</textarea></td>
        <td><input type="text" data-sc="${i}|loc" value="${esc(r.loc||"")}" placeholder="Ch.5 §5.2"></td>
        <td><select class="${r.caught==="Missed by the ledger"?"st-missing":(r.caught?"st-complete":"")}" data-sc="${i}|caught">${
          ["","Caught","Missed by the ledger"].map(o=>`<option ${o===(r.caught||"")?"selected":""}>${o||"Not checked"}</option>`).join("")}</select></td>
        <td class="rm"><button class="iconbtn" data-scrm="${i}" aria-label="Remove">✕</button></td></tr>`).join("")}
      </tbody></table></div>`:`<p style="color:var(--ink-3);font-size:13.5px;margin:0">No spot-checks recorded.</p>`}
    <div class="row-end"><button class="btn btn-sm" data-scadd="1">Add a spot-check</button></div>
    ${answered.length>=3 ? (missed
      ? `<div class="note stop" style="margin-top:14px"><strong>${missed} of ${answered.length} checked statements were missed.</strong> Recall on this run is demonstrably incomplete. Treat the ledger as a partial list of candidates, weight the hand-enumerated rows accordingly, and record this in your statement of what the method missed.</div>`
      : `<div class="note warn" style="margin-top:14px"><strong>All ${answered.length} checked statements were caught.</strong> That is encouraging about this run and is not a clearance certificate. You tested a handful of statements you already knew about; the failures that matter are the ones you would not think to test for.</div>`) : ""}
  </div>`;
}

function readingsHTML(){
  const R=S.readings;
  const box=(k,lbl)=>`<div class="reading"><div class="rh">${esc(lbl)}</div>
    <textarea data-rd="${k}" placeholder="Paste the answer">${esc(R[k])}</textarea></div>`;
  const vbox=(name,cur,opts,extra)=>`<div class="verdict">${opts.map(([t,d])=>`<label class="vopt ${cur===t?"sel":""}">
    <input type="radio" name="${name}" value="${esc(t)}" ${cur===t?"checked":""}>
    <span><span class="vt">${esc(t)}</span><span class="vd">${esc(d)}</span></span></label>`).join("")}</div>${extra||""}`;

  const baseDone = R.baselineVerdict;
  return `<div class="sec">
    <h3>Step 1 — the baseline</h3>
    <p class="hint">Run the identical procedure on a text you have independent reason to believe is clearly argued: a well-regarded published paper in your field, or a chapter your supervisor has already told you is unambiguous. Whatever divergence that produces is the method's noise floor.</p>
    <div class="field"><span class="label">Baseline text</span>
      <input type="text" data-rd="baselineName" value="${esc(R.baselineName)}" placeholder="e.g. Eisenhardt (1989), AMR — theory-building from case studies"></div>
    <div class="readings">${box("b1","Baseline reading 1")}${box("b2","Baseline reading 2")}${box("b3","Baseline reading 3")}</div>
    <div style="margin-top:14px"><span class="label" style="display:block;margin-bottom:6px">Divergence on the baseline — your noise floor</span>
      ${vbox("bverdict",R.baselineVerdict,[
        ["Stable","The three baseline readings substantially agree. Divergence on your own text will mean something."],
        ["Variable but compatible","The baseline itself produced some variation. Expect at least this much on your own text."],
        ["Materially divergent","The procedure diverges even on a text known to be clear. Tighten the question or the conditions before going further — as it stands the test cannot tell you anything about your manuscript."]
      ])}</div>
    ${R.baselineVerdict==="Materially divergent"?`<div class="note stop" style="margin-top:12px"><strong>The instrument is too noisy to read.</strong> Divergence on a clear text means the variation is coming from the procedure, not the manuscript. Specify the question more tightly, or hold the conditions more firmly constant, and re-run the baseline before testing your own chapters.</div>`:""}
  </div>

  <div class="sec" style="${baseDone?"":"opacity:.5;pointer-events:none"}">
    <h3>Step 2 — your material</h3>
    <p class="hint">${baseDone?"Same model, same version, same settings, same prompt wording, no prior context. If any of these changed between runs, the comparison is uninterpretable.":"Establish the baseline first. Without a noise floor there is nothing to measure against."}</p>
    <div class="readings">${box("r1","Reading 1 — fresh context")}${box("r2","Reading 2 — fresh context")}${box("r3","Reading 3 — fresh context")}</div>
    <div style="margin-top:14px"><span class="label" style="display:block;margin-bottom:6px">Your classification</span>
      ${vbox("verdict",R.verdict,[
        ["Stable","Independent readings substantially agree."],
        ["Variable but compatible","Different readings emphasise different aspects without contradicting one another."],
        ["Materially divergent","Different readings imply significantly different understandings — and the divergence exceeds what the same procedure produced on the baseline."]
      ])}</div>
    <div class="field" style="margin-top:14px"><span class="label">If divergent, what in the text permitted it?</span>
      <textarea data-rd="note" placeholder="Not which answer was right — why the chapter could support more than one reading, and why you are confident this exceeds the noise floor.">${esc(S.readings.note)}</textarea></div>
    ${S.readings.verdict==="Materially divergent"?`<div class="note warn" style="margin-top:4px"><strong>Only this category warrants revision.</strong> Check the divergence against your baseline before acting: if the baseline produced comparable variation, this is instrumentation noise rather than evidence about your writing. Some theoretical arguments are appropriately nuanced or deliberately open — the point is that you should know where the ambiguity is.</div>`:""}
  </div>`;
}

function viewPass(p){
  const st=S.passes[p.id], mine=findingsFor(p.id);
  return `<div class="card">
    <div class="pass-head">
      <div class="pass-eyebrow"><span class="n">${String(p.n).padStart(2,"0")}</span><span class="of">Pass ${p.n} of 7</span></div>
      <h2>${esc(p.key)}</h2>
      <p class="lede">${esc(p.lede)}</p>
      <div class="rationale"><span class="label">Why this pass</span>${p.rationale.map(r=>`<p>${esc(r)}</p>`).join("")}</div>
      ${p.correction?`<div class="rationale correction" style="margin-top:12px"><span class="label">Where this is most likely to mislead</span>${p.correction.map(r=>`<p>${esc(r)}</p>`).join("")}</div>`:""}
    </div>

    <div class="sec"><h3>Set the pass</h3><p class="hint">The prompt below rebuilds as you type.</p>
      ${p.fields.map(f=>fieldHTML(p,f)).join("")}</div>

    ${promptHTML(p)}
    ${p.ledger?ledgerHTML(p.ledger):""}
    ${p.custom==="spotcheck"?spotcheckHTML():""}
    ${p.custom==="readings"?readingsHTML():""}
    ${runlogHTML(p)}

    <div class="sec"><h3>Working notes</h3>
      <p class="hint">For your own thinking. Not included in the supervisor summary.</p>
      <textarea id="passNotes" data-p="${p.id}" placeholder="What you noticed, what to come back to.">${esc(st.notes)}</textarea></div>

    <div class="sec"><h3>Findings from this pass <span class="label" style="margin-left:6px">${mine.length}</span></h3>
      <p class="hint">Record anything worth pursuing. It goes to the findings register, where you decide what to do about it.</p>
      ${mine.length?mine.map(f=>findingHTML(f)).join(""):`<p style="color:var(--ink-3);font-size:13.5px;margin:0">Nothing recorded from this pass yet.</p>`}
      <div class="row-end">
        <button class="btn" data-newfinding="${p.id}">Record a finding</button><span class="spacer"></span>
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer">
          <input type="checkbox" id="passDone" ${st.done?"checked":""}> Mark this pass complete</label>
      </div>
    </div>
  </div>`;
}

function findingHTML(f){
  const p=pass(f.pass), isOpen=!!open[f.id], disp=f.disposition;
  const stamp = disp?`<span class="stamp ${disp}">${DISPOSITIONS.find(d=>d.k===disp).t}</span>`:`<span class="stamp open">Not adjudicated</span>`;
  const ready=gateComplete(f);
  const head=`<div class="finding-head" data-toggle="${f.id}">
    <span class="chev">${isOpen?"▾":"▸"}</span>
    <span class="ttl">${esc(f.title||"Untitled finding")}<span class="meta">${p?`Pass ${p.n} · ${esc(p.key)}`:"Unassigned"}${f.location?` · ${esc(f.location)}`:""}</span></span>
    ${stamp}</div>`;
  if(!isOpen) return `<div class="finding ${disp?"resolved d-"+disp:""}">${head}</div>`;

  return `<div class="finding ${disp?"resolved d-"+disp:""}">${head}<div class="finding-body">
    <div class="field" style="margin-top:16px"><span class="label">What was flagged</span>
      <input type="text" data-fd="${f.id}|title" value="${esc(f.title)}" placeholder="One line, in your own words"></div>
    <div class="grid2">
      <div class="field"><span class="label">Where in the thesis</span>
        <input type="text" data-fd="${f.id}|location" value="${esc(f.location)}" placeholder="e.g. Ch. 2 §2.4 p.41 and Ch. 4 §4.2 p.88"></div>
      <div class="field"><span class="label">Which pass raised it</span>
        <select data-fd="${f.id}|pass"><option value="">Unassigned</option>${PASSES.map(x=>`<option value="${x.id}" ${x.id===f.pass?"selected":""}>Pass ${x.n} — ${esc(x.key)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><span class="label">The evidence the model produced</span>
      <div class="sub">Paste the quoted passages with their locations, not the model's assessment of them.</div>
      <textarea data-fd="${f.id}|evidence" placeholder="Quoted passages with locations.">${esc(f.evidence)}</textarea></div>

    <div class="gate">
      <div class="gate-head"><h4>Before this becomes a decision</h4><span class="label">Four questions</span></div>
      <p class="hint">Answer these yourself, from the thesis. Until all four are answered the model has identified something to investigate — not something that must change.</p>

      <div class="gate-q"><div class="q"><span class="qn">01</span><span>What exactly has the model identified?</span></div>
        <select data-fd="${f.id}|g1">${FINDING_TYPES.map(o=>`<option value="${esc(o)}" ${o===f.g1?"selected":""}>${o?esc(o):"Choose one"}</option>`).join("")}</select></div>

      <div class="gate-q"><div class="q"><span class="qn">02</span><span>Where is the evidence?</span></div>
        <div class="sub" style="margin-left:20px">Locate the passages in your own manuscript. Give the references you found, not the ones the model asserted. If you cannot locate them, the criticism cannot be evaluated.</div>
        <textarea data-fd="${f.id}|g2" rows="2" placeholder="The passages I located, and their references.">${esc(f.g2)}</textarea></div>

      <div class="gate-q"><div class="q"><span class="qn">03</span><span>Could you explain why the issue matters?</span></div>
        <div class="sub" style="margin-left:20px">If you cannot, the criticism may merely sound sophisticated.</div>
        <textarea data-fd="${f.id}|g3" rows="2" placeholder="Why this affects the argument, in disciplinary terms.">${esc(f.g3)}</textarea></div>

      <div class="gate-q"><div class="q"><span class="qn">04</span><span>Would you make the same judgement after reading the passages yourself?</span></div>
        <select data-fd="${f.id}|g4">${["","Yes","Partly","No"].map(o=>`<option value="${esc(o)}" ${o===f.g4?"selected":""}>${o||"Choose one"}</option>`).join("")}</select></div>

      <div class="gate-status"><span class="msg ${ready?"ready":""}">${ready?"All four answered. You can now decide what happens to this finding.":"Answer all four questions to unlock the decision."}</span></div>

      <div class="verdict" style="margin-top:14px">
        ${DISPOSITIONS.map(d=>`<label class="vopt ${f.disposition===d.k?"sel":""}" style="${ready?"":"opacity:.45;cursor:not-allowed"}">
          <input type="radio" name="disp-${f.id}" value="${d.k}" ${f.disposition===d.k?"checked":""} ${ready?"":"disabled"} data-disp="${f.id}">
          <span><span class="vt">${d.t}</span><span class="vd">${esc(d.d)}</span></span></label>`).join("")}</div>

      ${f.disposition?`<div class="field" style="margin-top:14px"><span class="label">${f.disposition==="dismissed"?"Why you are dismissing it":"What you will do"}</span>
        <textarea data-fd="${f.id}|action" rows="2" placeholder="${f.disposition==="dismissed"?"Your reasoning. This is part of the audit record.":"The change, or what you need in order to decide."}">${esc(f.action)}</textarea></div>`:""}
    </div>
    <div class="row-end"><span class="spacer"></span><button class="btn btn-sm btn-danger" data-frm="${f.id}">Delete finding</button></div>
  </div></div>`;
}

function viewFindings(){
  const all=S.findings;
  const c={open:all.filter(f=>!f.disposition).length,revise:all.filter(f=>f.disposition==="revise").length,
    investigate:all.filter(f=>f.disposition==="investigate").length,dismissed:all.filter(f=>f.disposition==="dismissed").length};
  const shown = filter==="all"?all : filter==="open"?all.filter(f=>!f.disposition) : all.filter(f=>f.disposition===filter);
  const chips=[["all","All ("+all.length+")"],["open","Not adjudicated ("+c.open+")"],["revise","Revise ("+c.revise+")"],
    ["investigate","Investigate ("+c.investigate+")"],["dismissed","Dismissed ("+c.dismissed+")"]];

  return `<div class="card">
    <div class="pass-head"><span class="label">Across the audit</span>
      <h2 style="margin-top:6px">Findings register</h2>
      <p class="lede">Everything the seven passes turned up, and what you decided about it. Dismissals matter as much as revisions — together they are the record of judgement exercised.</p></div>
    <div class="stat-strip">
      <div class="stat holdv"><div class="v">${c.open}</div><div class="k label">Not adjudicated</div></div>
      <div class="stat flagv"><div class="v">${c.revise}</div><div class="k label">To revise</div></div>
      <div class="stat holdv"><div class="v">${c.investigate}</div><div class="k label">To investigate</div></div>
      <div class="stat clearv"><div class="v">${c.dismissed}</div><div class="k label">Dismissed</div></div></div>
    <div class="filters">${chips.map(([k,t])=>`<button class="chip ${filter===k?"on":""}" data-filter="${k}">${esc(t)}</button>`).join("")}</div>
    ${shown.length?shown.map(f=>findingHTML(f)).join(""):`<div class="empty">
      <h3>${all.length?"Nothing under this filter":"No findings recorded yet"}</h3>
      <p>${all.length?"Change the filter to see the rest.":"Findings are recorded from within each pass, as the model returns evidence worth pursuing."}</p>
      ${all.length?"":`<button class="btn btn-primary" data-go="p1">Go to Pass 1</button>`}</div>`}
    ${all.length?`<div class="row-end"><button class="btn" data-newfinding="">Record a finding</button></div>`:""}
  </div>`;
}

function viewLimits(){
  const L=S.limits;
  const total=S.findings.length, acted=S.findings.filter(f=>f.disposition==="revise").length;
  const thin = total<=3;
  return `<div class="card">
    <div class="pass-head"><span class="label">Across the audit</span>
      <h2 style="margin-top:6px">What this method missed</h2>
      <p class="lede">One question to ask of the whole exercise, before you report anything from it.</p>
      <div class="rationale correction"><span class="label">Why this page is required, not optional</span>
        <p>The passes search for particular kinds of failure — undischarged promises, definitional drift, unwarranted inference, overstated contribution. A thesis can be weak in ways none of them are looking for: a poorly chosen research question, a literature the author has not read, a method that was competently executed and inappropriate from the outset. None of those will appear in a ledger.</p>
        <p>What the machine does not report is not thereby absent. The governing principle includes the judgement about what it failed to find.</p></div></div>

    <div class="sec"><h3>What would this method have missed?</h3>
      <p class="hint">Write this in your own terms, about this thesis. What kinds of weakness would these seven passes be structurally incapable of surfacing here?</p>
      <textarea data-lim="missed" style="min-height:130px" placeholder="e.g. None of the passes can tell me whether the research question was worth asking, or whether the sampling frame was appropriate. Neither can they detect a literature I have simply not encountered — the audit only sees what is in the manuscript.">${esc(L.missed)}</textarea></div>

    <div class="sec"><h3>What the audit did and did not establish</h3>
      <p class="hint">A student who runs all seven passes and finds little has not established that the thesis is sound.</p>
      ${thin?`<div class="note warn" style="margin-bottom:14px"><strong>This audit produced ${total} finding${total===1?"":"s"}.</strong> That is a thin result, and thin results are exactly where the temptation to read reassurance is strongest. Consider whether the passes were run on enough of the manuscript, and whether your Pass 2 recall spot-check supports the coverage you are implying.</div>`:""}
      <div class="field"><span class="label">Your statement</span>
        <select data-lim="nullAck">${["",
          "These procedures, on this occasion, did not surface anything further — which is a weaker statement than soundness",
          "The audit surfaced substantive problems, which are recorded in the register",
          "Coverage was partial; the audit does not speak to the chapters not run"].map(o=>`<option value="${esc(o)}" ${o===L.nullAck?"selected":""}>${o||"Choose the statement that is actually true"}</option>`).join("")}</select></div>
      <div class="field"><span class="label">Coverage — what was and was not audited</span>
        <div class="sub">Which chapters were run through which passes, and which were not.</div>
        <textarea data-lim="nullNote" placeholder="e.g. Passes 1 and 5 run on Chapters 2, 4 and 7. Chapters 5–6 not audited — participant data, excluded under the ethics check. Pass 2 recall spot-check missed 1 of 4.">${esc(L.nullNote)}</textarea></div>
      <p class="hint" style="margin-top:2px">${acted?`${acted} finding${acted===1?" was":"s were"} marked for revision.`:"No findings have been marked for revision."} This statement appears at the head of the supervisor summary.</p>
    </div>
    <div class="row-end"><button class="btn btn-primary" data-go="export">Next: save &amp; share</button></div>
  </div>`;
}

function viewLog(){
  const rows=S.runlog;
  return `<div class="card">
    <div class="pass-head"><span class="label">Across the audit</span>
      <h2 style="margin-top:6px">Run log</h2>
      <p class="lede">What was run, on which chapters, with which model. Whether a use is permitted and whether it must be declared are separate matters — and a declaration is far easier to write from a contemporaneous log than to reconstruct at submission.</p></div>
    ${rows.length?`<div class="tbl-scroll"><table class="ledger" style="min-width:640px">
      <thead><tr><th style="width:14%">Date</th><th style="width:20%">Pass</th><th style="width:26%">Model and version</th><th style="width:40%">Material supplied</th><th></th></tr></thead>
      <tbody>${rows.map(r=>{const p=pass(r.pass);return `<tr>
        <td><input type="text" data-rl="${r.id}|date" value="${esc(r.date)}"></td>
        <td style="padding-top:12px;font-size:12.5px;color:var(--ink-2)">${p?`Pass ${p.n} — ${esc(p.key)}`:"—"}</td>
        <td><input type="text" data-rl="${r.id}|model" value="${esc(r.model)}" placeholder="e.g. Copilot (GPT-5), EDP on"></td>
        <td><input type="text" data-rl="${r.id}|scope" value="${esc(r.scope)}" placeholder="e.g. Ch.4 full text, quotes redacted"></td>
        <td class="rm"><button class="iconbtn" data-rlrm="${r.id}" aria-label="Remove">✕</button></td></tr>`}).join("")}
      </tbody></table></div>`:`<div class="empty"><h3>Nothing logged yet</h3><p>Entries are added from within each pass as you run it. Logging contemporaneously is much easier than reconstructing later.</p><button class="btn btn-primary" data-go="p1">Go to Pass 1</button></div>`}
    ${rows.length?`<div class="note" style="margin-top:16px"><strong>Declaration.</strong> ${esc(S.preflight.declare.note||"You have not recorded what your institution requires you to declare. Return to the pre-upload questions.")}</div>`:""}
  </div>`;
}

function viewExport(){
  const done=PASSES.filter(p=>S.passes[p.id].done).length;
  const openN=S.findings.filter(f=>!f.disposition).length;
  const limMissing=!String(S.limits.missed||"").trim();
  return `<div class="card">
    <div class="pass-head"><span class="label">Across the audit</span>
      <h2 style="margin-top:6px">Save &amp; share</h2>
      <p class="lede">Your work lives in a file you keep. Nothing is stored on a server, and closing the tab without saving will lose it.</p></div>
    <div class="stat-strip">
      <div class="stat"><div class="v">${done}/7</div><div class="k label">Passes complete</div></div>
      <div class="stat"><div class="v">${S.findings.length}</div><div class="k label">Findings</div></div>
      <div class="stat ${openN?"holdv":"clearv"}"><div class="v">${openN}</div><div class="k label">Not adjudicated</div></div>
      <div class="stat"><div class="v">${S.runlog.length}</div><div class="k label">Runs logged</div></div></div>

    <div class="sec"><h3>Your audit file</h3>
      <p class="hint">A single JSON file holding everything — pre-flight, fields, ledgers, findings, run log, notes. Save as you go and reopen to continue.</p>
      <div class="row-end" style="margin-top:0"><button class="btn btn-primary" id="x-save">Save audit file</button>
        <button class="btn" id="x-load">Open an audit file</button></div></div>

    <div class="sec"><h3>Supervisor summary</h3>
      <p class="hint">A self-contained page showing what you found, what you decided, why, and what the method could not see. It carries your reasoning and your ledger entries — not the raw model output and not your working notes.</p>
      ${limMissing?`<div class="note stop" style="margin-bottom:14px"><strong>State what the method missed first.</strong> Without it the summary reads as a coverage claim the audit cannot support. <button class="btn btn-sm" data-go="limits" style="margin-left:8px">Write it</button></div>`:""}
      ${openN?`<div class="note warn" style="margin-bottom:14px"><strong>${openN} finding${openN>1?"s have":" has"} not been adjudicated.</strong> They will appear marked as such, which is fine if you want to discuss them in supervision.</div>`:""}
      <div class="row-end" style="margin-top:0"><button class="btn btn-primary" id="x-sup" ${limMissing?"disabled":""}>Download supervisor summary</button></div></div>

    <div class="sec"><h3>Start again</h3>
      <p class="hint">Clears everything in this tab. Save first if you want to keep it.</p>
      <div class="row-end" style="margin-top:0"><button class="btn btn-danger" id="x-reset">Clear this audit</button></div></div>
  </div>`;
}

/* ============================================================
   RENDER + BIND
   ============================================================ */

function render(){
  const chip=$("#thesisChip");
  chip.textContent=S.meta.title||"";
  chip.style.display=S.meta.title?"":"none";
  renderNav();
  const st=$("#stage");
  st.innerHTML =
    view==="setup"?viewSetup():
    view==="preflight"?viewPreflight():
    view==="how"?viewHow():
    view==="findings"?viewFindings():
    view==="limits"?viewLimits():
    view==="log"?viewLog():
    view==="export"?viewExport():
    viewPass(pass(view));
  bindAll();
}

function refreshGate(f){
  const head=document.querySelector(`[data-toggle="${f.id}"]`);
  if(!head) return;
  const card=head.parentElement, ready=gateComplete(f);
  const msg=card.querySelector(".gate-status .msg");
  if(msg){ msg.classList.toggle("ready",ready);
    msg.textContent=ready?"All four answered. You can now decide what happens to this finding.":"Answer all four questions to unlock the decision."; }
  card.querySelectorAll(`[data-disp="${f.id}"]`).forEach(r=>{
    r.disabled=!ready;
    const box=r.closest(".vopt"); if(box) box.style.cssText = ready?"":"opacity:.45;cursor:not-allowed";
  });
}

function bindAll(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    view=b.dataset.go; render(); window.scrollTo({top:0,behavior:"instant"}); });

  document.querySelectorAll("[data-m]").forEach(el=>{
    const h=()=>{ S.meta[el.dataset.m]=el.value; touch();
      if(el.dataset.m==="title"){const c=$("#thesisChip");c.textContent=el.value;c.style.display=el.value?"":"none";} };
    el.oninput=h; if(el.tagName==="SELECT") el.onchange=h; });

  document.querySelectorAll("[data-pfs]").forEach(el=>{
    el.onchange=()=>{ S.preflight[el.dataset.pfs].state=el.value; touch(); render(); }; });
  document.querySelectorAll("[data-pfn]").forEach(el=>{
    el.oninput=()=>{ S.preflight[el.dataset.pfn].note=el.value; touch(); }; });

  document.querySelectorAll("[data-pf2]").forEach(el=>{
    const h=()=>{ const [pid,k]=el.dataset.pf2.split("|");
      S.passes[pid].fields[k]=el.value; touch();
      const pv=$("#promptBody"); if(pv) pv.textContent=pass(pid).build(S.passes[pid].fields); };
    el.oninput=h; if(el.tagName==="SELECT") el.onchange=h; });

  const nt=$("#passNotes"); if(nt) nt.oninput=()=>{ S.passes[nt.dataset.p].notes=nt.value; touch(); };

  document.querySelectorAll("[data-lg]").forEach(el=>{
    const [k,i,c]=el.dataset.lg.split("|");
    const h=()=>{ S.ledgers[k][+i][c]=el.value; touch(); if(el.tagName==="SELECT") render(); };
    el.oninput=h; if(el.tagName==="SELECT") el.onchange=h; });
  document.querySelectorAll("[data-lgadd]").forEach(b=>b.onclick=()=>{ S.ledgers[b.dataset.lgadd].push({}); touch(); render(); });
  document.querySelectorAll("[data-lgrm]").forEach(b=>b.onclick=()=>{
    const [k,i]=b.dataset.lgrm.split("|"); S.ledgers[k].splice(+i,1); touch(); render(); });

  document.querySelectorAll("[data-sc]").forEach(el=>{
    const [i,k]=el.dataset.sc.split("|");
    const h=()=>{ S.spotchecks[+i][k]=el.value; touch(); if(el.tagName==="SELECT") render(); };
    el.oninput=h; if(el.tagName==="SELECT") el.onchange=h; });
  document.querySelectorAll("[data-scadd]").forEach(b=>b.onclick=()=>{ S.spotchecks.push({text:"",loc:"",caught:""}); touch(); render(); });
  document.querySelectorAll("[data-scrm]").forEach(b=>b.onclick=()=>{ S.spotchecks.splice(+b.dataset.scrm,1); touch(); render(); });

  document.querySelectorAll("[data-rd]").forEach(el=>{ el.oninput=()=>{ S.readings[el.dataset.rd]=el.value; touch(); }; });
  document.querySelectorAll('input[name="verdict"]').forEach(el=>{ el.onchange=()=>{ S.readings.verdict=el.value; touch(); render(); }; });
  document.querySelectorAll('input[name="bverdict"]').forEach(el=>{ el.onchange=()=>{ S.readings.baselineVerdict=el.value; touch(); render(); }; });

  document.querySelectorAll("[data-lim]").forEach(el=>{
    const h=()=>{ S.limits[el.dataset.lim]=el.value; touch(); if(el.tagName==="SELECT") render(); };
    el.oninput=h; if(el.tagName==="SELECT") el.onchange=h;
    if(el.dataset.lim==="missed") el.onblur=()=>renderNav(); });

  document.querySelectorAll("[data-rl]").forEach(el=>{
    const [id,k]=el.dataset.rl.split("|");
    el.oninput=()=>{ const r=S.runlog.find(x=>x.id===id); if(r){ r[k]=el.value; touch(); } }; });
  document.querySelectorAll("[data-rladd]").forEach(b=>b.onclick=()=>{
    S.runlog.push({id:"r"+(S.seq++),pass:b.dataset.rladd,date:new Date().toISOString().slice(0,10),
      model:S.passes.p6.fields.conditions||"",scope:""});
    touch(); render(); });
  document.querySelectorAll("[data-rlrm]").forEach(b=>b.onclick=()=>{
    S.runlog=S.runlog.filter(r=>r.id!==b.dataset.rlrm); touch(); render(); });

  const c=$("#btnCopy");
  if(c) c.onclick=async()=>{
    if(!pfCleared()) return;
    const txt=$("#promptBody").textContent;
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} document.body.removeChild(ta); }
    $("#copyOk").textContent="Copied";
    setTimeout(()=>{const k=$("#copyOk"); if(k) k.textContent="";},1800); };

  const pd=$("#passDone"); if(pd) pd.onchange=()=>{ S.passes[view].done=pd.checked; touch(); render(); };

  document.querySelectorAll("[data-newfinding]").forEach(b=>b.onclick=()=>{
    const pid=b.dataset.newfinding||view;
    const f={id:"f"+(S.seq++),pass:PASSES.some(p=>p.id===pid)?pid:"",title:"",location:"",evidence:"",
      g1:"",g2:"",g3:"",g4:"",disposition:"",action:""};
    S.findings.push(f); open[f.id]=true; touch(); render();
    setTimeout(()=>{const el=document.querySelector(`[data-fd="${f.id}|title"]`); if(el) el.focus();},30); });

  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ open[b.dataset.toggle]=!open[b.dataset.toggle]; render(); });

  document.querySelectorAll("[data-fd]").forEach(el=>{
    const [id,k]=el.dataset.fd.split("|");
    const f=S.findings.find(x=>x.id===id); if(!f) return;
    const apply=()=>{
      f[k]=el.value; touch();
      if(k==="title"){ const t=el.closest(".finding").querySelector(".finding-head .ttl");
        if(t&&t.firstChild) t.firstChild.nodeValue=el.value||"Untitled finding"; return; }
      if(k==="pass"){ render(); return; }
      if(["g1","g2","g3","g4"].includes(k)){
        if(f.disposition && !gateComplete(f)){ f.disposition=""; render(); return; }
        refreshGate(f); } };
    el.oninput=apply; if(el.tagName==="SELECT") el.onchange=apply; });

  document.querySelectorAll("[data-disp]").forEach(el=>{
    el.onchange=()=>{ const f=S.findings.find(x=>x.id===el.dataset.disp);
      if(f&&gateComplete(f)){ f.disposition=el.value; touch(); render(); } }; });

  document.querySelectorAll("[data-frm]").forEach(b=>b.onclick=()=>{
    if(!confirm("Delete this finding? The record of your reasoning goes with it.")) return;
    S.findings=S.findings.filter(f=>f.id!==b.dataset.frm); touch(); render(); });

  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ filter=b.dataset.filter; render(); });

  const bind=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  bind("#x-save",saveFile); bind("#x-load",()=>$("#fileIn").click()); bind("#x-sup",supervisorSummary);
  bind("#x-reset",()=>{ if(confirm("Clear this audit? Everything not saved to a file will be lost.")){
    S=blank(); open={}; view="setup"; dirty=false; render(); paintSave(); toast("Cleared"); } });
}

/* ============================================================
   SAVE / LOAD / EXPORT
   ============================================================ */

function slug(){
  const t=(S.meta.title||S.meta.student||"thesis-audit").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
  return (t||"thesis-audit")+"-"+new Date().toISOString().slice(0,10);
}
function download(name,text,type){
  const b=new Blob([text],{type}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function saveFile(){
  download(slug()+".json",JSON.stringify(S,null,2),"application/json");
  dirty=false; paintSave(); toast("Audit file saved to your downloads");
}
$("#fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!d.passes||!d.findings) throw new Error("shape");
      const base=blank();
      S={...base,...d,
        meta:{...base.meta,...(d.meta||{})},
        preflight:Object.fromEntries(PREFLIGHT.map(p=>[p.k,{...base.preflight[p.k],...((d.preflight||{})[p.k]||{})}])),
        ledgers:{...base.ledgers,...(d.ledgers||{})},
        readings:{...base.readings,...(d.readings||{})},
        limits:{...base.limits,...(d.limits||{})},
        spotchecks:Array.isArray(d.spotchecks)?d.spotchecks:[],
        runlog:Array.isArray(d.runlog)?d.runlog:[],
        passes:Object.fromEntries(PASSES.map(p=>[p.id,{...base.passes[p.id],...((d.passes||{})[p.id]||{})}]))};
      const ids=[...S.findings.map(x=>x.id),...S.runlog.map(x=>x.id)]
        .map(x=>parseInt(String(x).replace(/\D/g,""),10)||0);
      S.seq=Math.max(1,...ids,0)+1;
      open={}; view="setup"; dirty=false; render(); paintSave(); toast("Audit file opened");
    }catch(err){ alert("That file could not be read as an audit file. Choose a JSON file saved by this tool."); }
    e.target.value="";
  };
  r.readAsText(f);
});

function supervisorSummary(){
  const m=S.meta, L=S.limits;
  const byDisp=k=>S.findings.filter(f=>f.disposition===k);
  const openF=S.findings.filter(f=>!f.disposition);
  const pName=id=>{const p=pass(id); return p?`Pass ${p.n} — ${p.key}`:"Unassigned";};

  const fBlock=f=>`<div class="f ${f.disposition||"open"}">
    <div class="ft">${esc(f.title||"Untitled finding")}</div>
    <div class="fm">${esc(pName(f.pass))}${f.location?` &nbsp;·&nbsp; ${esc(f.location)}`:""}${f.g1?` &nbsp;·&nbsp; ${esc(f.g1)}`:""}</div>
    ${f.g2?`<p><span class="k">Evidence located in the thesis</span>${esc(f.g2)}</p>`:""}
    ${f.g3?`<p><span class="k">Why it matters</span>${esc(f.g3)}</p>`:""}
    ${f.g4?`<p><span class="k">Same judgement on reading the passages myself</span>${esc(f.g4)}</p>`:""}
    ${f.action?`<p><span class="k">${f.disposition==="dismissed"?"Reason for dismissal":"Action"}</span>${esc(f.action)}</p>`:""}</div>`;

  const ledgerBlock=cfg=>{
    const rows=(S.ledgers[cfg.k]||[]).filter(r=>Object.values(r).some(v=>String(v||"").trim()));
    if(!rows.length) return "";
    return `<h3>${esc(cfg.title)}</h3><table><thead><tr>${cfg.cols.map(c=>`<th>${esc(c.h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cfg.cols.map(c=>`<td>${esc(r[c.k]||"—")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  };

  const passRows=PASSES.map(p=>{
    const st=S.passes[p.id], n=findingsFor(p.id).length;
    return `<tr><td>${p.n}</td><td>${esc(p.key)}</td><td>${st.done?"Complete":(passTouched(p)?"In progress":"Not started")}</td><td>${n||"—"}</td></tr>`;
  }).join("");

  const scRows=S.spotchecks.filter(r=>r.caught);
  const scMissed=scRows.filter(r=>r.caught==="Missed by the ledger").length;
  const scBlock=scRows.length?`<h3>Pass 2 recall spot-check</h3>
    <p class="body">${scMissed
      ? `Of ${scRows.length} promissory statements known to exist and checked against the ledger, ${scMissed} ${scMissed===1?"was":"were"} not caught. Recall on this run is demonstrably incomplete and the ledger should be read as a partial list of candidates.`
      : `All ${scRows.length} checked statements were caught. This is encouraging about the run and is not a clearance certificate — the failures that matter are the ones that would not be thought of as tests.`}</p>`:"";

  const R=S.readings;
  const readingBlock = R.verdict?`<h3>Independent-reading test</h3>
    <p><span class="k">Question tested</span>${esc(S.passes.p6.fields.question||"—")}</p>
    <p><span class="k">Baseline text</span>${esc(R.baselineName||"Not recorded")}</p>
    <p><span class="k">Divergence on the baseline (noise floor)</span>${esc(R.baselineVerdict||"Not established")}</p>
    <p><span class="k">Divergence on this manuscript</span>${esc(R.verdict)}</p>
    ${R.note?`<p><span class="k">What in the text permitted it</span>${esc(R.note)}</p>`:""}`:"";

  const logBlock=S.runlog.length?`<h2>Run log</h2>
    <table><thead><tr><th>Date</th><th>Pass</th><th>Model and version</th><th>Material supplied</th></tr></thead><tbody>
    ${S.runlog.map(r=>{const p=pass(r.pass);return `<tr><td>${esc(r.date||"—")}</td><td>${p?`Pass ${p.n}`:"—"}</td><td>${esc(r.model||"—")}</td><td>${esc(r.scope||"—")}</td></tr>`;}).join("")}
    </tbody></table>`:"";

  const pfBlock=`<h2>Pre-upload checks</h2><table><thead><tr><th>Question</th><th>Position</th><th>Note</th></tr></thead><tbody>
    ${PREFLIGHT.map(p=>`<tr><td>${esc(p.q)}</td><td>${esc(S.preflight[p.k].state||"Not considered")}</td><td>${esc(S.preflight[p.k].note||"—")}</td></tr>`).join("")}
    </tbody></table>`;

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thesis audit summary — ${esc(m.title||m.student||"")}</title>
<style>
body{font-family:"IBM Plex Sans",-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#17212B;background:#fff;margin:0;padding:44px 24px;line-height:1.55;font-size:14.5px}
.w{max-width:840px;margin:0 auto}
h1{font-family:Spectral,Georgia,serif;font-size:27px;margin:0 0 4px;font-weight:600}
h2{font-family:Spectral,Georgia,serif;font-size:20px;margin:38px 0 4px;padding-bottom:6px;border-bottom:1px solid #CFD8DE;font-weight:600}
h3{font-family:Spectral,Georgia,serif;font-size:16px;margin:24px 0 8px;font-weight:600}
.sub{color:#46596B;font-size:13.5px;margin:0 0 26px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;font-size:13.5px;color:#46596B;border:1px solid #E1E8EB;background:#F4F7F8;border-radius:4px;padding:16px 18px;margin-bottom:8px}
.meta b{color:#17212B;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 4px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#46596B;font-weight:500;padding:8px 9px;background:#F4F7F8;border-bottom:1px solid #CFD8DE}
td{padding:8px 9px;border-bottom:1px solid #E1E8EB;vertical-align:top}
.f{border:1px solid #E1E8EB;border-left:3px solid #7B8C9B;border-radius:0 4px 4px 0;padding:14px 18px;margin-bottom:12px;background:#fff;break-inside:avoid}
.f.revise{border-left-color:#8C2F39}.f.investigate{border-left-color:#9C6412}
.f.dismissed{border-left-color:#7B8C9B;background:#F8FAFA}.f.open{border-left-color:#9C6412}
.ft{font-weight:500;font-size:15px;font-family:Spectral,Georgia,serif}
.fm{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7B8C9B;margin-top:3px}
.f p,p.body{margin:11px 0 0;font-size:13.5px;color:#2B3B48}
.k{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#7B8C9B;margin-bottom:2px}
.scope{border:1px solid #E1E8EB;border-left:3px solid #9C6412;background:#F9F4EA;padding:16px 20px;border-radius:0 4px 4px 0;margin:22px 0 0}
.scope h3{margin-top:0}
.note{border:1px solid #E1E8EB;border-left:2px solid #7B8C9B;background:#F4F7F8;padding:13px 16px;font-size:13px;color:#46596B;margin-top:30px;border-radius:0 3px 3px 0}
.none{color:#7B8C9B;font-size:13.5px;font-style:italic}
@media print{body{padding:0}.w{max-width:none}}
</style></head><body><div class="w">
<h1>Thesis audit summary</h1>
<p class="sub">A record of what a structured seven-pass audit surfaced, the judgements made about it, and what the method was not capable of seeing.</p>
<div class="meta">
  <div><b>Thesis</b><br>${esc(m.title||"—")}</div><div><b>Field</b><br>${esc(m.discipline||"—")}</div>
  <div><b>Candidate</b><br>${esc(m.student||"—")}</div><div><b>Supervisor</b><br>${esc(m.supervisor||"—")}</div>
  <div><b>Stage</b><br>${esc(m.stage||"—")}</div>
  <div><b>Summary produced</b><br>${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>
</div>

<div class="scope">
  <h3>What this audit does and does not establish</h3>
  ${L.nullAck?`<p class="body"><span class="k">Position</span>${esc(L.nullAck)}</p>`:""}
  ${L.nullNote?`<p class="body"><span class="k">Coverage</span>${esc(L.nullNote)}</p>`:""}
  <p class="body"><span class="k">What this method would have missed</span>${esc(L.missed||"—")}</p>
  ${scBlock}
</div>

<h2>Coverage by pass</h2>
<table><thead><tr><th>Pass</th><th>Focus</th><th>State</th><th>Findings</th></tr></thead><tbody>${passRows}</tbody></table>

<h2>Findings to act on</h2>
${byDisp("revise").length?byDisp("revise").map(fBlock).join(""):`<p class="none">None recorded.</p>`}

<h2>Findings to investigate</h2>
${byDisp("investigate").length?byDisp("investigate").map(fBlock).join(""):`<p class="none">None recorded.</p>`}

<h2>Findings considered and dismissed</h2>
<p class="sub" style="margin-bottom:14px">Candidate problems examined against the manuscript and judged not to require change. The reasoning is included because it forms part of the audit.</p>
${byDisp("dismissed").length?byDisp("dismissed").map(fBlock).join(""):`<p class="none">None recorded.</p>`}

${openF.length?`<h2>Not yet adjudicated</h2>
<p class="sub" style="margin-bottom:14px">Raised by the audit but not yet tested against the four diagnostic questions. Offered for discussion, not as conclusions.</p>
${openF.map(fBlock).join("")}`:""}

<h2>Ledgers</h2>
${PASSES.filter(p=>p.ledger).map(p=>ledgerBlock(p.ledger)).join("")||`<p class="none">No ledger entries recorded.</p>`}
${readingBlock}

${pfBlock}
${logBlock}

<div class="note">This summary was produced with the Thesis Audit Workbench. The audit uses a language model for extraction, comparison and the construction of counterarguments. Every judgement recorded here — whether an apparent problem is genuine, whether it matters, and what should be done about it — was made by the candidate after locating the relevant passages in the manuscript. No text in this summary is model output. The method is suited to finding problems and not to ruling them out: what it did not report is not thereby absent.</div>
</div></body></html>`;

  download(slug()+"-summary.html",html,"text/html");
  toast("Supervisor summary downloaded");
}

$("#btnSave").onclick=saveFile;
$("#btnLoad").onclick=()=>$("#fileIn").click();
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ============================================================
   EMBEDDING
   When the tool runs inside an iframe on a host page it reports its
   height, so the host can size the frame instead of nesting scrollbars.
   Add ?embed=flow to the src to release the sticky header and rail.
   ============================================================ */
(function(){
  if(window.parent===window) return;
  try{
    if(new URLSearchParams(location.search).get("embed")==="flow")
      document.documentElement.classList.add("framed");
  }catch(e){}
  let last=0;
  const report=()=>{
    const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);
    if(Math.abs(h-last)>8){ last=h;
      try{ window.parent.postMessage({thesisAuditHeight:h},"*"); }catch(e){} }
  };
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener("load",report);
  setInterval(report,700);
})();

render(); paintSave();
</script>
