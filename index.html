<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Audit Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17212B; --ink-2:#46596B; --ink-3:#7B8C9B;
  --paper:#E9EDEF; --surface:#FFFFFF; --surface-2:#F4F7F8;
  --rule:#CFD8DE; --rule-soft:#E1E8EB;
  --accent:#0F5E6B; --accent-hi:#14808F; --accent-soft:#DCEAEC;
  --flag:#8C2F39; --flag-soft:#F4E3E4;
  --hold:#9C6412; --hold-soft:#F7EDDA;
  --clear:#2C6650; --clear-soft:#DEEAE4;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:272px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.2;margin:0}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:2px}

.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#EAF0F2;border-bottom:1px solid #0B1119}
.topbar-inner{max-width:1400px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.wordmark .mark{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#6FA8B2;text-transform:uppercase;white-space:nowrap}
.wordmark .name{font-family:var(--display);font-size:19px;color:#F4F8F9;white-space:nowrap}
.wordmark .thesis{font-size:12.5px;color:#93A7B2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:12px;border-left:1px solid #33414F}
.topbar-actions{display:flex;align-items:center;gap:8px}
.savestate{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#93A7B2;display:flex;align-items:center;gap:7px;white-space:nowrap}
.savestate .dot{width:7px;height:7px;border-radius:50%;background:#3D5361}
.savestate.dirty{color:#E8B77A}
.savestate.dirty .dot{background:#D99B3F}

.btn{font-family:var(--body);font-size:13px;font-weight:500;padding:7px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--rule);background:var(--surface);color:var(--ink);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:#fff}
.btn-ghost{background:transparent;border-color:#3D5361;color:#D6E2E6}
.btn-ghost:hover{background:#22303C;border-color:#5A7383;color:#fff}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-danger{color:var(--flag);border-color:#DCC3C5}
.btn-danger:hover{background:var(--flag-soft);border-color:var(--flag)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);border-color:var(--rule)}
.btn-ghost:disabled:hover{background:transparent;border-color:#3D5361}

.shell{max-width:1400px;margin:0 auto;display:flex;align-items:flex-start}
nav.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:57px;align-self:flex-start;max-height:calc(100vh - 57px);overflow-y:auto;padding:26px 0 40px 22px}
.rail-group{margin-bottom:26px}
.rail-group>.label{padding-left:26px;margin-bottom:10px;display:block}
.seq{position:relative;padding-left:26px}
.seq::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:1px;background:var(--rule)}
.seq-item{position:relative;display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px 7px 0;font-family:var(--body);font-size:13.5px;color:var(--ink-2);cursor:pointer;line-height:1.35}
.seq-item:hover{color:var(--ink)}
.seq-item .node{position:absolute;left:-22px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--rule-soft);box-shadow:0 0 0 3px var(--paper);transition:background .15s,border-color .15s}
.seq-item .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:8px}
.seq-item.touched .node{border-color:var(--accent);background:var(--accent-soft)}
.seq-item.done .node{background:var(--accent);border-color:var(--accent)}
.seq-item.active{color:var(--ink);font-weight:600}
.seq-item.active .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent-soft)}
.seq-item .cnt{font-family:var(--mono);font-size:10px;color:var(--flag);margin-left:6px}
.rail-flat{padding-left:26px;display:flex;flex-direction:column;gap:2px}
.flat-item{background:none;border:0;text-align:left;cursor:pointer;font-family:var(--body);font-size:13.5px;color:var(--ink-2);padding:6px 10px 6px 0;display:flex;align-items:center;gap:8px}
.flat-item:hover{color:var(--ink)}
.flat-item.active{color:var(--ink);font-weight:600}
.pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--flag-soft);color:var(--flag)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
main.stage{flex:1 1 auto;min-width:0;padding:26px 22px 90px}

.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:4px;padding:26px 28px;margin-bottom:18px}
.pass-head{margin-bottom:20px}
.pass-eyebrow{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.pass-eyebrow .n{font-family:var(--mono);font-size:26px;color:var(--accent);line-height:1;letter-spacing:-.02em}
.pass-eyebrow .of{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.pass-head h2{font-size:27px;letter-spacing:-.01em}
.pass-head .lede{color:var(--ink-2);font-size:14.5px;margin-top:8px;max-width:66ch}

.rationale{border-left:2px solid var(--accent);background:var(--accent-soft);padding:14px 18px;margin:18px 0 0;border-radius:0 3px 3px 0}
.rationale .label{color:var(--accent);margin-bottom:6px;display:block}
.rationale p{margin:0;font-family:var(--display);font-size:15.5px;line-height:1.5;color:#123E46;max-width:70ch}
.rationale p+p{margin-top:9px}
.rationale.correction{border-left-color:var(--flag);background:var(--flag-soft)}
.rationale.correction .label{color:var(--flag)}
.rationale.correction p{color:#5E1F27}

.sec{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule-soft)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sec>h3{font-size:17px;margin-bottom:4px}
.sec>.hint{color:var(--ink-2);font-size:13.5px;margin:0 0 14px;max-width:70ch}

.field{margin-bottom:14px}
.field>label,.field>.label{display:block;margin-bottom:5px}
.field .sub{font-size:12.5px;color:var(--ink-3);margin:-1px 0 6px}
input[type=text],textarea,select{width:100%;font-family:var(--body);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:8px 11px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='%237B8C9B' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.prompt-wrap{border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface-2)}
.prompt-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:#C9D8DD}
.prompt-bar .label{color:#7FA9B3;margin-right:auto}
.prompt-body{font-family:var(--mono);font-size:12.5px;line-height:1.65;padding:16px 18px;white-space:pre-wrap;word-break:break-word;max-height:430px;overflow-y:auto;color:#22303A}
.copy-ok{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8FD3B4}
.locked{border-top:1px solid #33414F;background:#101923;color:#D8A96A;font-size:12.5px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.locked button{margin-left:auto}

.tbl-scroll{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:4px}
table.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;background:var(--surface)}
table.ledger th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:500;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--rule);vertical-align:bottom}
table.ledger td{padding:5px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.ledger tr:last-child td{border-bottom:0}
table.ledger textarea{min-height:52px;font-size:13px;padding:6px 8px;border-color:transparent;background:transparent}
table.ledger textarea:hover{border-color:var(--rule-soft);background:var(--surface)}
table.ledger textarea:focus{border-color:var(--accent);background:var(--surface)}
table.ledger input[type=text]{font-size:13px;padding:6px 8px;border-color:transparent;background:transparent}
table.ledger input[type=text]:hover{border-color:var(--rule-soft);background:var(--surface)}
table.ledger select{font-size:12.5px;padding:6px 24px 6px 8px;background-position:right 7px center}
td.rm{width:34px;text-align:center;padding-top:11px}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:14px;line-height:1;padding:4px 6px;border-radius:3px}
.iconbtn:hover{color:var(--flag);background:var(--flag-soft)}
.st-complete{color:var(--clear)}
.st-partial,.st-unclear{color:var(--hold)}
.st-missing{color:var(--flag)}

.finding{background:var(--surface);border:1px dashed var(--rule);border-left:3px dashed var(--hold);border-radius:4px;margin-bottom:14px}
.finding.resolved{border-style:solid;border-left-width:3px}
.finding.d-revise{border-left-color:var(--flag)}
.finding.d-investigate{border-left-color:var(--hold)}
.finding.d-dismissed{border-left-color:var(--ink-3);opacity:.82}
.finding-head{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;cursor:pointer}
.finding-head:hover{background:var(--surface-2)}
.finding-head .ttl{flex:1 1 auto;min-width:0;font-weight:500;font-size:14.5px}
.finding-head .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;font-weight:400;display:block}
.stamp{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap;border:1px solid}
.stamp.open{color:var(--hold);border-color:var(--hold);background:var(--hold-soft)}
.stamp.revise{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.stamp.investigate{color:var(--hold);border-color:var(--hold);background:var(--hold-soft)}
.stamp.dismissed{color:var(--ink-2);border-color:var(--rule);background:var(--surface-2)}
.chev{color:var(--ink-3);font-family:var(--mono);font-size:12px;padding-top:2px}
.finding-body{padding:4px 18px 20px;border-top:1px solid var(--rule-soft)}
.gate{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:4px;padding:18px 20px;margin-top:18px}
.gate-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.gate-head h4{font-size:15.5px}
.gate .hint{font-size:13px;color:var(--ink-2);margin:0 0 16px;max-width:66ch}
.gate-q{margin-bottom:15px}
.gate-q>.q{font-family:var(--display);font-size:15px;font-weight:500;display:flex;gap:9px;margin-bottom:6px}
.gate-q>.q .qn{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:4px}
.gate-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 0;margin-top:16px;border-top:1px solid var(--rule)}
.gate-status .msg{font-size:13px;color:var(--ink-2);margin-right:auto}
.gate-status .msg.ready{color:var(--clear)}

.empty{text-align:center;padding:44px 24px;color:var(--ink-2);border:1px dashed var(--rule);border-radius:4px;background:var(--surface)}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:48ch;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px;border-radius:14px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.reading{border:1px solid var(--rule-soft);border-radius:4px;overflow:hidden}
.reading .rh{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft);color:var(--ink-2)}
.reading textarea{border:0;border-radius:0;min-height:120px;font-size:13px}
.reading textarea:focus{box-shadow:none;border:0}
.verdict{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.vopt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);border-radius:4px;padding:11px 14px;cursor:pointer;background:var(--surface)}
.vopt:hover{border-color:var(--ink-3)}
.vopt input{margin:3px 0 0}
.vopt .vt{font-weight:500;font-size:14px;display:block}
.vopt .vd{font-size:13px;color:var(--ink-2);margin-top:1px;display:block}
.vopt.sel{border-color:var(--accent);background:var(--accent-soft)}

.note{border:1px solid var(--rule);border-left:2px solid var(--ink-3);background:var(--surface-2);border-radius:0 3px 3px 0;padding:14px 18px;font-size:13.5px;color:var(--ink-2);max-width:78ch}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--hold);background:var(--hold-soft);color:#5F3E0B}
.note.warn strong{color:#4A300A}
.note.stop{border-left-color:var(--flag);background:var(--flag-soft);color:#5E1F27}
.note.stop strong{color:#4A171E}
.row-end{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.spacer{flex:1 1 auto}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:4px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:24px;color:var(--ink);line-height:1.1}
.stat .k{margin-top:4px}
.stat.flagv .v{color:var(--flag)}
.stat.holdv .v{color:var(--hold)}
.stat.clearv .v{color:var(--clear)}

/* pre-flight */
.pf{border:1px solid var(--rule-soft);border-radius:4px;margin-bottom:12px;overflow:hidden}
.pf-h{display:flex;gap:12px;align-items:flex-start;padding:15px 18px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft)}
.pf-h .pfn{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:3px}
.pf-h h4{font-size:16px;flex:1 1 auto}
.pf-b{padding:15px 18px}
.pf-b p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);max-width:74ch}
.pf.ok{border-left:3px solid var(--clear)}
.pf.na{border-left:3px solid var(--ink-3)}
.pf.bad{border-left:3px solid var(--flag)}
.pf.none{border-left:3px solid var(--hold)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#EAF0F2;padding:10px 18px;border-radius:4px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1000px){
  :root{--rail:100%}
  .shell{flex-direction:column}
  nav.rail{position:static;width:100%;max-height:none;padding:18px 22px 0;border-bottom:1px solid var(--rule)}
  .rail-group{margin-bottom:16px}
  .readings,.grid2{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:1fr 1fr}
  .card{padding:20px 18px}
  .wordmark .thesis{display:none}
}
/* Embedded in a host page with ?embed=flow — the parent scrolls, so nothing sticks */
.framed .topbar{position:static}
.framed nav.rail{position:static;max-height:none;overflow:visible}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,nav.rail,.no-print{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="wordmark">
      <span class="mark">Doctoral</span>
      <span class="name">Thesis Audit Workbench</span>
      <span class="thesis" id="thesisChip"></span>
    </div>
    <div class="topbar-actions">
      <span class="savestate" id="saveState"><span class="dot"></span><span id="saveText">Saved</span></span>
      <button class="btn btn-ghost btn-sm" id="btnLoad">Open audit</button>
      <button class="btn btn-primary btn-sm" id="btnSave">Save audit</button>
    </div>
  </div>
</div>

<div class="shell">
  <nav class="rail" aria-label="Audit sections">
    <div class="rail-group"><span class="label">Before you start</span><div class="rail-flat" id="navSetup"></div></div>
    <div class="rail-group"><span class="label">The seven passes</span><div class="seq" id="navPasses"></div></div>
    <div class="rail-group"><span class="label">Across the audit</span><div class="rail-flat" id="navEnd"></div></div>
  </nav>
  <main class="stage" id="stage"></main>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
"use strict";

/* ============================================================
   SHARED PROMPT PREAMBLE
   ============================================================ */

const PREAMBLE =
`You are assisting with a structured audit of a doctoral thesis. Follow these rules throughout.

1. Present evidence before judgement. Extract and quote first; assess afterwards.
2. Make every row indexical. Each item you return must carry the relevant wording and a location — chapter, section, page or paragraph — so that I can return to the manuscript and check it.
3. Where wording matters — definitions, central claims, contribution statements — reproduce the wording exactly rather than paraphrasing it.
4. Do not infer a missing logical step merely because you can see how the author could have made it. Identify where that step needs to be made explicit.
5. If you cannot find something, write "I cannot locate this" and say where you looked. Do not conclude that it is absent.
6. Do not treat the absence of a problem as the absence of problems. If you have searched and found nothing, say that you found nothing, not that there is nothing.
7. Produce candidate problems accompanied by evidence, not verdicts. The judgement is mine to make.
8. Do not repair, smooth over or complete the argument on my behalf.`;

/* ============================================================
   PRE-FLIGHT
   ============================================================ */

const PREFLIGHT = [
  {k:"data", n:1, q:"Where does the data go?",
   body:`At the Open University, students may upload their work provided they are logged into Microsoft Copilot with their student account and the green shield indicating Enterprise Data Protection is visible. That means the material is not retained and is not used for training. Students at other institutions should consult their own university's policies rather than assuming an equivalent arrangement exists — consumer and enterprise deployments of the same underlying model can differ materially in how they handle uploaded content.`,
   ask:"Which service will you use, and what does your institution's policy say about it?",
   ph:"e.g. Microsoft Copilot, signed in with student account, Enterprise Data Protection shield visible."},
  {k:"ethics", n:2, q:"Does the ethics approval extend this far?",
   body:`A thesis containing interview transcripts, survey responses or other participant data was collected under an approval, and under a participant information sheet that told those participants how their data would be processed. Enterprise Data Protection addresses the security of processing. It does not retrospectively widen the consent that was given. Before uploading empirical chapters, check what the approval and the information sheet actually say, and consider whether the audit can be run on anonymised or redacted versions of the data-bearing sections.`,
   ask:"What do the approval and the participant information sheet actually say, and which chapters are affected?",
   ph:"e.g. Chapters 4–5 contain interview extracts. Information sheet limits processing to the research team. Will run those chapters on redacted versions."},
  {k:"third", n:3, q:"Is any of the material subject to a third-party constraint?",
   body:`Industrially sponsored and collaborative studentships, non-disclosure agreements, commercially sensitive data and embargoed chapters all sit outside the institutional question entirely. A tenant boundary does not override a contractual one.`,
   ask:"Which constraints apply, and to which material?",
   ph:"e.g. No NDA. Or: sponsor agreement covers the Chapter 6 case data — excluded from the audit."},
  {k:"declare", n:4, q:"Does this use need to be declared?",

  {
    id:"p2", n:2, key:"Commitment audit",

 ? `PART A — the commitments below were enumerated by hand. This list is authoritative. Do not add to it, do not merge entries, and do not silently drop any. Return exactly one ledger row per line.\n"""\n${hand}\n"""`

`Every difference you report must appear alongside the quoted evidence from both locations. A difference reported without both passages quoted is not usable.`,"",

function toast(m){
  const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400);
}

const pfCleared = () => PREFLIGHT.every(p=>{
  const v=S.preflight[p.k].state;
  return v && v!=="Unresolved — I must not proceed yet";
});
const pfOutstanding = () => PREFLIGHT.filter(p=>{
  const v=S.preflight[p.k].state;
  return !v || v==="Unresolved — I must not proceed yet";
}).length;

function passTouched(p){
  const st=S.passes[p.id];
  if(st.done||st.notes.trim()) return true;
  if(Object.values(st.fields||{}).some(v=>String(v||"").trim())) return true;
  if(p.ledger && (S.ledgers[p.ledger.k]||[]).length) return true;
  if(p.custom==="readings" && (S.readings.r1||S.readings.r2||S.readings.r3||S.readings.b1)) return true;
  if(p.custom==="spotcheck" && S.spotchecks.length) return true;
  if(S.runlog.some(r=>r.pass===p.id)) return true;
  return S.findings.some(f=>f.pass===p.id);
}
const findingsFor = id => S.findings.filter(f=>f.pass===id);
const gateComplete = f => !!(f.g1 && String(f.g2||"").trim() && String(f.g3||"").trim() && f.g4);

function renderNav(){
  const out=pfOutstanding();
  $("#navSetup").innerHTML =
    `<button class="flat-item ${view==="setup"?"active":""}" data-go="setup">The thesis</button>
     <button class="flat-item ${view==="preflight"?"active":""}" data-go="preflight">Before uploading anything
       ${out?`<span class="pill warn">${out} open</span>`:`<span class="pill">Cleared</span>`}</button>
     <button class="flat-item ${view==="how"?"active":""}" data-go="how">How this works</button>`;

  $("#navPasses").innerHTML = PASSES.map(p=>{
    const st=S.passes[p.id], t=passTouched(p), n=findingsFor(p.id).length;
    return `<button class="seq-item ${view===p.id?"active":""} ${st.done?"done":(t?"touched":"")}" data-go="${p.id}">
      <span class="node"></span><span class="num">${String(p.n).padStart(2,"0")}</span>${esc(p.key)}${n?`<span class="cnt">${n}</span>`:""}</button>`;
  }).join("");

  const openN = S.findings.filter(f=>!f.disposition).length;
  const limDone = String(S.limits.missed||"").trim();
  $("#navEnd").innerHTML =
    `<button class="flat-item ${view==="findings"?"active":""}" data-go="findings">Findings register
       ${S.findings.length?`<span class="pill ${openN?"warn":""}">${openN?openN+" open":S.findings.length}</span>`:""}</button>
     <button class="flat-item ${view==="limits"?"active":""}" data-go="limits">What this missed
       ${limDone?`<span class="pill">Stated</span>`:`<span class="pill hold">Required</span>`}</button>
     <button class="flat-item ${view==="log"?"active":""}" data-go="log">Run log
       ${S.runlog.length?`<span class="pill">${S.runlog.length}</span>`:""}</button>
     <button class="flat-item ${view==="export"?"active":""}" data-go="export">Save &amp; share</button>`;
}

function fieldHTML(p,f){
  const v = S.passes[p.id].fields[f.k] || "";
  const sub = f.sub ? `<div class="sub">${esc(f.sub)}</div>` : "";
  let ctrl;
  if(f.t==="textarea") ctrl=`<textarea data-pf2="${p.id}|${f.k}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
  else if(f.t==="select") ctrl=`<select data-pf2="${p.id}|${f.k}">${f.opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else ctrl=`<input type="text" data-pf2="${p.id}|${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||"")}">`;
  return `<div class="field"><span class="label">${esc(f.label)}</span>${sub}${ctrl}</div>`;
}

function ledgerHTML(cfg){
  const rows = S.ledgers[cfg.k] || [];
  const body = rows.length ? rows.map((r,i)=>`<tr>${
    cfg.cols.map(c=>{
      if(c.type==="select"){
        const cls = ({"Discharged":"st-complete","Established":"st-complete","Legitimate development":"st-complete","Hand-enumerated":"st-complete",
          "Partial":"st-partial","Undecided":"st-unclear","Different emphasis":"st-unclear","Model-found":"st-partial",
          "Cannot locate":"st-missing","Altered without explanation":"st-missing","Wording exceeds evidence":"st-missing","Inconsistency":"st-missing"})[r[c.k]]||"";
        return `<td><select class="${cls}" data-lg="${cfg.k}|${i}|${c.k}">${c.opts.map(o=>`<option ${o===(r[c.k]||"")?"selected":""}>${esc(o)}</option>`).join("")}</select></td>`;
      }
      return `<td><textarea data-lg="${cfg.k}|${i}|${c.k}" rows="2">${esc(r[c.k]||"")}</textarea></td>`;
    }).join("")
  }<td class="rm"><button class="iconbtn" data-lgrm="${cfg.k}|${i}" title="Remove row" aria-label="Remove row">✕</button></td></tr>`).join("")
  : `<tr><td colspan="${cfg.cols.length+1}" style="padding:22px;text-align:center;color:var(--ink-3);font-size:13.5px">No rows yet.</td></tr>`;

  return `<div class="sec">
    <h3>${esc(cfg.title)}</h3><p class="hint">${esc(cfg.hint)}</p>
    <div class="tbl-scroll"><table class="ledger">
      <thead><tr>${cfg.cols.map(c=>`<th style="width:${c.w}">${esc(c.h)}</th>`).join("")}<th></th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="row-end"><button class="btn btn-sm" data-lgadd="${cfg.k}">Add row</button></div>
  </div>`;
}

function promptHTML(p){
  const cleared = pfCleared();
  return `<div class="sec">
    <h3>The prompt</h3>
    <p class="hint">Copy this into your language model together with the relevant text.</p>
    <div class="prompt-wrap">
      <div class="prompt-bar"><span class="label">Prompt — pass ${p.n}</span>
        <span class="copy-ok" id="copyOk"></span>
        <button class="btn btn-ghost btn-sm" id="btnCopy" ${cleared?"":"disabled"}>Copy prompt</button></div>
      <div class="prompt-body" id="promptBody">${esc(p.build(S.passes[p.id].fields))}</div>
      ${cleared?"":`<div class="locked"><span>Copying is held until the four pre-upload questions are settled. Those constraints determine whether any of this is available to you.</span>
        <button class="btn btn-sm" data-go="preflight">Settle them</button></div>`}
    </div>
  </div>`;
}

function runlogHTML(p){
  const rows=S.runlog.filter(r=>r.pass===p.id);
  return `<div class="sec">
    <h3>Log this run</h3>
    <p class="hint">Keep a record of what was run, on which chapters, with which model. If a declaration is required at submission it is far easier to write from a contemporaneous log than to reconstruct one.</p>
    ${rows.length?`<div class="tbl-scroll"><table class="ledger" style="min-width:520px">
      <thead><tr><th style="width:16%">Date</th><th style="width:30%">Model and version</th><th style="width:44%">Material supplied</th><th></th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><input type="text" data-rl="${r.id}|date" value="${esc(r.date)}"></td>
        <td><input type="text" data-rl="${r.id}|model" value="${esc(r.model)}" placeholder="e.g. Copilot (GPT-5), EDP on"></td>
        <td><input type="text" data-rl="${r.id}|scope" value="${esc(r.scope)}" placeholder="e.g. Ch.4 full text, redacted quotes"></td>
        <td class="rm"><button class="iconbtn" data-rlrm="${r.id}" aria-label="Remove entry">✕</button></td></tr>`).join("")}
      </tbody></table></div>`:`<p style="color:var(--ink-3);font-size:13.5px;margin:0">No runs logged for this pass.</p>`}
    <div class="row-end"><button class="btn btn-sm" data-rladd="${p.id}">Log a run</button></div>
  </div>`;
}

    <div class="grid2">
      <div class="field"><span class="label">Thesis title</span><input type="text" data-m="title" value="${esc(m.title)}" placeholder="Working title"></div>
      <div class="field"><span class="label">Discipline or field</span><input type="text" data-m="discipline" value="${esc(m.discipline)}" placeholder="e.g. Organisational behaviour"></div>
